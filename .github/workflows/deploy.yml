name: Test and Deploy

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    backend-test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    cache: npm

            -   name: Install workspace dependencies
                run: npm ci

            -   name: Run backend lint
                run: npm run lint -w former-backend

            -   name: Run backend tests
                run: npm run test -w former-backend

    frontend-test:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    cache: npm

            -   name: Install workspace dependencies
                run: npm ci

            -   name: Run frontend lint
                run: npm run lint -w former-frontend

            -   name: Run frontend tests
                run: npm run test -w former-frontend

    backend-deploy:
        needs: backend-test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Install Heroku CLI
                run: curl https://cli-assets.heroku.com/install.sh | sh

            -   name: Deploy backend to Heroku
                uses: akhileshns/heroku-deploy@v3.15.15
                with:
                    heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
                    heroku_app_name: ${{ vars.HEROKU_BACKEND_APP }}
                    heroku_email: ${{ secrets.HEROKU_EMAIL }}

    frontend-deploy:
        needs: frontend-test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Install Heroku CLI
                run: curl https://cli-assets.heroku.com/install.sh | sh

            -   name: Deploy frontend to Heroku
                uses: akhileshns/heroku-deploy@v3.15.15
                with:
                    heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
                    heroku_app_name: ${{ vars.HEROKU_FRONTEND_APP }}
                    heroku_email: ${{ secrets.HEROKU_EMAIL }}