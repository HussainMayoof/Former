services:
  server:
    image: former-backend
    build: .
    ports:
      - 3000:3000
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/former
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    container_name: former-backend

  postgres:
    image: postgres:18.4-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    container_name: former-postgres

volumes:
  postgres-data: