name: Test and Deploy

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    backend-test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Run backend lint and tests
                run: docker build --target test-stage -t former-backend-test ./former-backend

    frontend-test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Run frontend lint and tests
                run: docker build --target test-stage -t former-frontend-test -f former-frontend/Dockerfile .

    backend-deploy:
        needs: backend-test
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Log in to Heroku Container Registry
                uses: docker/login-action@v3
                with:
                    registry: registry.heroku.com
                    username: _]
                    password: ${{ secrets.HEROKU_API_KEY }}

            -   name: Build and push backend image
                uses: docker/build-push-action@v6
                with:
                    context: ./former-backend
                    target: serve-stage
                    platforms: linux/amd64
                    provenance: false
                    sbom: false
                    outputs: type=image,name=registry.heroku.com/${{ vars.HEROKU_BACKEND_APP }}/web,push=true,oci-mediatypes=false
                    cache-from: type=gha,scope=backend
                    cache-to: type=gha,mode=max,scope=backend

            -   name: Install Heroku CLI
                run: curl https://cli-assets.heroku.com/install.sh | sh

            -   name: Release backend
                env:
                    HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
                run: heroku container:release web --app ${{ vars.HEROKU_BACKEND_APP }}

    frontend-deploy:
        needs: frontend-test
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Log in to Heroku Container Registry
                uses: docker/login-action@v3
                with:
                    registry: registry.heroku.com
                    username: _
                    password: ${{ secrets.HEROKU_API_KEY }}

            -   name: Build and push frontend image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file: ./former-frontend/Dockerfile
                    platforms: linux/amd64
                    provenance: false
                    sbom: false
                    build-args: |
                        VITE_API_URL=${{ vars.BACKEND_URL }}
                    outputs: type=image,name=registry.heroku.com/${{ vars.HEROKU_FRONTEND_APP }}/web,push=true,oci-mediatypes=false
                    cache-from: type=gha,scope=frontend
                    cache-to: type=gha,mode=max,scope=frontend

            -   name: Install Heroku CLI
                run: curl https://cli-assets.heroku.com/install.sh | sh

            -   name: Release frontend
                env:
                    HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
                run: heroku container:release web --app ${{ vars.HEROKU_FRONTEND_APP }}